spring:
  application:

    name: customify-backend
  datasource:
    url: jdbc:mysql://localhost:3306/customify?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate # Dejamos que Flyway controle el esquema, JPA solo valida
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB
  flyway:
    enabled: true
    locations: classpath:db/migration


jwt:
  # Clave de 256 bits generada para desarrollo
  secret: Y3VzdG9taWZ5LXN1cGVyLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LXB1cnBvc2Vz
  expiration: 86400000 # 24 horas

file:
  upload-dir: ./uploads

