<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customify - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm mb-5">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">Customify</a>
        <div class="d-flex align-items-center">
            <span id="userNameDisplay" class="me-3 text-muted"></span>
            <button id="logoutBtn" class="btn btn-sm btn-outline-danger">Cerrar Sesión</button>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Mis Productos</h3>
        <a href="/admin/products/new" class="btn btn-custom">+ Nuevo Producto</a>
    </div>

    <div class="row" id="products-container">
    </div>
</div>

<script>
    // 1. Comprobar si hay sesión
    const token = localStorage.getItem('customify_token');
    if (!token) {
        window.location.href = '/admin/login';
    }

    document.getElementById('userNameDisplay').textContent = 'Hola, ' + localStorage.getItem('customify_user');

    // 2. Cerrar sesión
    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('customify_token');
        localStorage.removeItem('customify_user');
        window.location.href = '/admin/login';
    });

    // 3. Cargar productos
    async function loadProducts() {
        try {
            const response = await fetch('/api/products', {
                headers: { 'Authorization': 'Bearer ' + token }
            });

            if (response.ok) {
                const products = await response.json();
                const container = document.getElementById('products-container');

                if (products.length === 0) {
                    container.innerHTML = '<div class="col-12"><p class="text-muted">Aún no tienes productos creados.</p></div>';
                    return;
                }

                container.innerHTML = products.map(p => `
                    <div class="col-md-4 mb-4">
                        <div class="card glass-card h-100 p-3">
                            <div class="card-body">
                                <h5 class="card-title fw-bold">${p.name}</h5>
                                <p class="card-text text-muted text-truncate">${p.description || 'Sin descripción'}</p>
                                <p class="card-text fs-5">€${p.basePrice}</p>
                          <div class="card-footer bg-transparent border-0 d-flex justify-content-between">
                                <span class="badge ${p.active ? 'bg-success' : 'bg-secondary'} align-self-center">
                                    ${p.active ? 'Activo' : 'Inactivo'}
                                </span>
                                <div>
                                    <a href="/admin/products/${p.id}/edit" class="btn btn-sm btn-outline-primary me-2">Editar</a>
                                    <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${p.id})">Eliminar</button>
                                </div>
                            </div>
                    </div>
                `).join('');
            } else if (response.status === 401 || response.status === 403) {
                localStorage.removeItem('customify_token');
                window.location.href = '/admin/login';
            }
        } catch (error) {
            console.error('Error cargando productos', error);
        }
    }

    // 4. Borrar producto
    async function deleteProduct(id) {
        if (confirm('¿Seguro que deseas eliminar este producto?')) {
            const res = await fetch(`/api/products/${id}`, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            if (res.ok) {
                loadProducts(); // Recargar la lista
            }
        }
    }

    // Iniciar carga
    loadProducts();
</script>
</body>
</html>
